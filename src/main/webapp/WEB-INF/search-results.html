<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/weather-app.png}" alt="" width="30" height="24"
                     class="d-inline-block align-text-top">
                Weather Tracker
            </a>
            <div th:if="${isUserAuthorized}">
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3" th:text="${username}"></span>
                    <form th:action="@{/auth/sign-out}" method="post">
                        <button type="submit" class="btn btn-outline-danger">Sign out</button>
                    </form>
                </div>
            </div>
            <div th:if="!${isUserAuthorized}">
                <div class="d-flex align-items-center">
                    <a th:href="@{/auth/sign-up}" class="btn btn-outline-danger">Sign Up</a>
                    <a th:href="@{/auth/sign-in}" class="btn btn-danger">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <section id="page-content">
        <div class="container mt-4">
            <form th:action="@{/search}" method="get" class="d-flex my-4">
                <div class="input-group location-search-input-group-flex-grow-1 me-3" style="flex: 2;">
                    <input class="form-control" type="text" name="name" th:value="${locationName}"
                           placeholder="Enter location" required>
                    <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                            onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>
                <button class="btn btn-outline-success">Search</button>
            </form>

            <div>
                <h2>Locations:</h2>

                <div th:if="${error}" class="alert alert-danger mt-3" role="alert" th:text="${error}">
                </div>

                <div class="row">
                    <div th:each="location : ${locations}" class="col-12 col-lg-3 col-md-6 mb-4">
                        <div class="card h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title"><span th:text="${location.name}"></span></h5>
                                <p class="card-text mb-1">Latitude: <span th:text="${location.latitude}"></span></p>
                                <p class="card-text mb-1">Longitude: <span th:text="${location.longitude}"></span></p>
                                <div class="mt-auto">
                                    <form th:action="@{/locations}" method="post">
                                        <input type="hidden" name="name" th:value="${location.name}">
                                        <input type="hidden" name="latitude" th:value="${location.latitude}">
                                        <input type="hidden" name="longitude" th:value="${location.longitude}">
                                        <button class="btn btn-primary w-100">Add</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
