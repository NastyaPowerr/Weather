<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Weather Viewer – Homepage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="d-flex flex-column min-vh-100">

<main class="flex-grow-1">
    <nav class="navbar navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">
                <img th:src="@{/images/weather-app.png}" alt="" width="30" height="24"
                     class="d-inline-block align-text-top">
                Weather Tracker
            </a>
            <div th:if="${isUserAuthorized}">
                <div class="d-flex align-items-center">
                    <span class="navbar-text me-3" th:text="${userLogin}"></span>
                    <form th:action="@{/auth/sign-out}" method="post">
                        <button type="submit" class="btn btn-outline-danger">Sign out</button>
                    </form>
                </div>
            </div>
            <div th:if="!${isUserAuthorized}">
                <div class="d-flex align-items-center">
                    <a th:href="@{/auth/sign-up}" class="btn btn-outline-danger">Sign Up</a>
                    <a th:href="@{/auth/sign-in}" class="btn btn-danger">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <section id="page-content">
        <div class="container mt-4">
            <form th:action="@{/search}" method="get" class="d-flex my-4">
                <div class="input-group location-search-input-group-flex-grow-1 me-3" style="flex: 2;">
                    <input class="form-control" type="text" name="name" placeholder="Enter location" required>
                    <button class="btn btn-outline-secondary btn-sm clear-input-button" type="button"
                            onclick="this.previousElementSibling.value=''">
                        &times;
                    </button>
                </div>
                <button class="btn btn-outline-success">Search</button>
            </form>

            <div th:if="${isUserAuthorized}">
                <div class="row">
                    <div th:each="weather : ${weathers}" class="col-12 col-lg-3 col-md-6 mb-4">
                        <div class="card h-100 position-relative weather-card">
                            <div class="position-absolute weather-card-delete-form">
                                <form th:action="@{/locations/delete}" method="post">
                                    <input type="hidden" name="locationId" th:value="${weather.id()}">
                                    <button class="btn-close" aria-label="Delete"></button>
                                </form>
                            </div>
                            <img class="card-img-top img-fluid"
                                 src="https://openweathermap.org/img/wn/04n@4x.png"
                                 alt="Weather icon">
                            <div class="card-body d-flex flex-column">
                                <h1 class="card-text" th:text="${weather.temp().toString()} + '°C'"></h1>
                                <h3 class="card-title" th:text="${weather.name()}"></h3>
                                <p class="card-text mb-1">
                                    Ощущается как <span th:text="${weather.tempFeelsLike().toString()} + '°C,'"></span>
                                </p>
                                <p class="card-text mb-1" th:text="${weather.clouds()} + '.'"></p>
                                <p class="card-text mb-1"> Влажность: <span
                                        th:text="${weather.humidity()} + '%'"> </span>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="!${isUserAuthorized}">
                <div class="px-4">
                    <span class="fs-4">To see weathers you need to <a th:href="@{/auth/sign-in}">log in</a> and add location.</span>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="d-flex flex-wrap justify-content-between align-items-center py-3 mt-4 border-top">
    <div class="px-4">
        <span>© Weather Viewer, project from <a href="https://zhukovsd.github.io/java-backend-learning-course/">zhukovsd/java-backend-learning-course</a> roadmap.</span>
    </div>
</footer>

</body>
</html>
